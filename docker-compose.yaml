# MariaDB w phpMyAdmin GUI

services:

  mariadb:
    container_name: mariadb
    image: mariadb:lts-ubi10
    networks: 
      - caddynet
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: my_database
      MARIADB_ROOT_PASSWORD: secure_root_password
      MARIADB_USER: my_user
      MARIADB_USER_PASSWORD: secure_user_password
    volumes:
      - /opt/vps3/vps3-data/db-mariad/db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin:5.2.3-fpm-alpine
    networks:
      - caddynet
    ports:
      - "127.0.0.1:8113:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  caddynet:
    external: true


